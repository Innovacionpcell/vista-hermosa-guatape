name: Build y deploy a Hostinger

# Hostinger compartido no ejecuta `npm run build`: el build corre aquí y por FTP
# solo viaja el contenido ya compilado de dist/.
#
# Requiere tres secrets en el repositorio (Settings → Secrets and variables →
# Actions). Ver README.md → Despliegue para saber de dónde sale cada uno en hPanel:
#   FTP_SERVER    · host FTP (ej. ftp.tudominio.com)
#   FTP_USERNAME  · usuario FTP
#   FTP_PASSWORD  · contraseña FTP
#
# Opcional, como variable de repositorio (no secret):
#   PUBLIC_SITE_URL · dominio definitivo, entra en canonical, og:url y sitemap.

on:
  push:
    branches: [main]
  # Permite lanzar un deploy a mano desde la pestaña Actions.
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Compilar y subir por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
        run: npm run build

      # dist/ incluye api/lead.php y .htaccess, porque ambos viven en public/.
      - name: Subir dist/ a /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          # El archivo con la URL y el secreto del webhook del CRM vive FUERA de
          # public_html y se subió a mano una sola vez: el sync no debe tocarlo.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            **/*.jsonl
